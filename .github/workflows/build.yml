name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # tag pushes create a GitHub Release

jobs:
  build:
    name: build (${{ matrix.env }})   # short job names; the matrix entries carry the per-board image settings too
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Per-board image layout: chip, where the bootloader goes, the flash options and
        # where the SPIFFS image goes (these match each build's partition table).
        include:
          - {env: cyd,       chip: esp32,   boot: "0x1000", flash: "--flash_mode dio --flash_freq 40m --flash_size 4MB", fs: "0x3D0000"}
          - {env: cyd2usb,   chip: esp32,   boot: "0x1000", flash: "--flash_mode dio --flash_freq 40m --flash_size 4MB", fs: "0x3D0000"}
          - {env: cyd2b,     chip: esp32,   boot: "0x1000", flash: "--flash_mode dio --flash_freq 40m --flash_size 4MB", fs: "0x3D0000"}
          - {env: cyd35,     chip: esp32,   boot: "0x1000", flash: "--flash_mode dio --flash_freq 40m --flash_size 4MB", fs: "0x3D0000"}
          # Freenove 4.0" ESP32-S3: bootloader at 0x0, DIO (QIO hangs the ROM), 2-Freenove4/partitions.csv
          - {env: freenove4, chip: esp32s3, boot: "0x0",    flash: "--flash_mode dio --flash_size 16MB",                fs: "0x510000"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio esptool==4.8.1

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Build merged flash image
        run: |
          B=.pio/build/${{ matrix.env }}
          mkdir -p parts dist
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin parts/
          pio run -e ${{ matrix.env }} -t buildfs      # this wipes $B/*.bin, so parts/ was copied first
          cp $B/spiffs.bin parts/
          BOOT=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          # Offsets match each board's partition table (min_spiffs.csv for the CYDs,
          # 2-Freenove4/partitions.csv for the Freenove). The merged file is flashed at
          # offset 0 (web installer / esptool); the update file is for the /update page.
          esptool.py --chip ${{ matrix.chip }} merge_bin \
            -o dist/CYD-PhotoFrame-${{ matrix.env }}-factory.bin \
            ${{ matrix.flash }} \
            ${{ matrix.boot }} parts/bootloader.bin 0x8000 parts/partitions.bin 0xe000 "$BOOT" \
            0x10000 parts/firmware.bin ${{ matrix.fs }} parts/spiffs.bin
          cp parts/firmware.bin dist/CYD-PhotoFrame-${{ matrix.env }}-update.bin
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          name: CYD PhotoFrame ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}   # tags like v4.2-beta1 are marked pre-release
          files: dist/*
          body: |
            ## Easiest: the web installer

            ### [➡ Open the Web Installer](https://grey-lancaster.github.io/CYD-PhotoFrame/)

            Use **Chrome or Edge on a computer**, plug the frame in by USB and click the button for your display:

            | Installer button | Build file | Display |
            | --- | --- | --- |
            | **1. CYD** | `cyd` | ILI9341, normal colours: the standard CYD and many "2 USB" boards. **Try this first.** |
            | **2. CYD2** | `cyd2usb` | ST7789: "2 USB" boards with an ST7789 display |
            | **3. CYD2 alternate** | `cyd2b` | ILI9341, inverted colours |
            | **4. 3.5" CYD** | `cyd35` | ST7796 480×320: the 3.5-inch CYD (touch calibration on first start) |
            | **5. Freenove 4" S3** | `freenove4` | Freenove FNK0104S 4.0-inch ESP32-S3 display, ST7796 480×320, capacitive touch (WiFi is set up on its own screen) |

            Wrong button = white screen or a negative picture. Nothing is damaged, just try another one.
            If only the colours are off, you don't need another file: open the frame's web page, go to
            *Settings* and tick **Swap red and blue** (reds look blue) or **Invert colours** (negative picture).

            ## Files in this release

            - **`*-factory.bin`**: the complete image. This is what the installer flashes (offset 0).
              It **erases the saved WiFi login and settings**, so you set up WiFi again. Photos on the SD card are never touched.
              Or: `esptool.py --chip esp32 write_flash 0x0 CYD-PhotoFrame-cyd-factory.bin`
            - **`*-update.bin`**: firmware only, for a frame that is already running: open
              `http://photoframe.local/update` and upload it. Keeps your WiFi login and settings.

            ## What's new in 4.6

            - **WiFi button on the address screen.** Touch the middle of the picture to show the IP / hostname screen and
              tap **WiFi**: the network picker opens with no time limit and a **Cancel** row. Your saved networks are kept;
              joining a new one restarts the frame on it. (Uses TouchWifiProvisioner 1.6.4.)
            - The address screen on a 2.8-inch board stood up in portrait now fits (smaller QR code).
            - Updating from 4.5.x: upload the `*-update.bin` for your build on the frame's `/update` page. That keeps
              your WiFi and settings.

            ## What's new in 4.5.4

            - **Fixes motion sleep on the Freenove 4-inch board.** On its chip (ESP32-S3) the WiFi radio does not give the
              detailed signal data the CYD boards use, so motion was never detected. The Freenove now watches how its
              WiFi signal strength changes instead. This is coarser than on the CYD boards: it reacts best to people
              moving near the frame or between it and the router. The CYD boards are unchanged.
            - Updating from 4.5.3: upload the `*-update.bin` for your build on the frame's `/update` page. That keeps
              your WiFi and settings.

            ## What's new in 4.5.3

            - **Motion log (every board):** under *About* on the web page, a short log shows when the screen went to
              sleep and when it woke, and why (motion, touch or the BOOT button). It keeps the last 20 events, has a
              **Clear log** button, and starts empty again when the frame restarts.
            - Updating from 4.5.2: upload the `*-update.bin` for your build on the frame's `/update` page. That keeps
              your WiFi and settings.

            ## What's new in 4.5.2

            - **Motion sleep (experimental, every board):** the screen can turn off when nobody is around and wake when
              someone moves or touches it. It uses the frame's own WiFi signal, no extra hardware. Off by default; turn
              it on under *Settings* on the web page, where a live score helps you tune the sensitivity.
            - The address screen now also shows the **WiFi network** the frame is connected to.
            - The Freenove 4-inch frame is now **http://photoframe4.local**, so it can run beside a CYD frame.
            - Updating from 4.5.1: upload the `*-update.bin` for your build on the frame's `/update` page. That keeps
              your WiFi and settings.

            ## What's new in 4.5.1

            - **Fixes a crash on the 2.8-inch and 3.5-inch CYD boards** (`cyd`, `cyd2usb`, `cyd2b`, `cyd35`): a photo narrower
              than the screen (for example 270 pixels wide on a 320 pixel screen) could make the frame restart each time
              it was shown. The frame now draws such photos correctly. The Freenove was not affected.
            - Updating from 4.5 or 4.4: upload the `*-update.bin` for your build on the frame's `/update` page. That keeps
              your WiFi and settings.

            ## What's new in 4.5

            - **The web page is now in English and Spanish.** It opens in the language the frame is set to (the one
              chosen on the frame's own WiFi screen), and the **EN / ES** switch in the corner changes the frame's
              language too, so both stay together. Translations may need polishing; corrections are welcome.
            - There is a Spanish README at the bottom of the project page.
            - Nothing else changed: updating from 4.4 with the `*-update.bin` keeps your WiFi and settings.

            ## What's new in 4.4

            - **Screen rotation** (a setting on the web page; the frame restarts when you change it):
              - **Every board:** 0, 90, 180 and 270 degrees (0 is the usual landscape), so the frame can stand up
                for portrait photos or have its USB port on any side.
              - The CYD boards ask you to touch the calibration targets the first time you use a new orientation (each
                orientation keeps its own calibration). The Freenove needs no extra calibration.
              - The web page's upload *Resize* option follows the frame's real size in the current rotation.
            - **WiFi is set up on the frame's own screen on every board** (the CYD builds now use the same picker as
              the Freenove). The `ESP32_AP` hotspot is gone: tap your network and type the password on the on-screen
              keyboard. Hidden networks can be typed in, and the frame remembers several networks and joins the
              strongest one it knows. A frame updated from 4.3 or older keeps its saved WiFi.
            - **English and Spanish:** the on-screen setup asks for a language the first time (a frame that
              already has WiFi saved keeps working as before). Translations may need polishing; reports welcome.
            - **Touch calibration on the 2.8-inch boards:** the first start asks you to touch five crosshairs
              (the 3.5-inch board keeps its four-corner calibration). *Recalibrate touch* on the web page works
              on every CYD.
            - **Tested on real boards:** `cyd2usb`, `cyd` (ILI9341), the 3.5-inch `cyd35` (rotation, portrait photos and
              the WiFi picker, by a user) and the Freenove 4-inch (all four rotations, swipes, portrait photos, WiFi
              and language screens). **Portrait on the 2.8-inch boards is new in this release and has had little testing.** **Not tested on a real board:** `cyd2b`. Reports are welcome in the issues.
            - Updating a frame that already runs 4.3 or newer: upload the `*-update.bin` for your build on the
              frame's `/update` page. That keeps the saved WiFi and settings.

            ## What's new in 4.3

            - **New board: Freenove FNK0104S 4.0-inch ESP32-S3** (installer button 5, build `freenove4`):
              ST7796 480×320 screen with capacitive touch. WiFi is set up on the frame's own screen
              (no hotspot), the SD card runs over SDMMC, sound plays through the on-board codec, and photos
              are scaled to fill the screen (small photos are enlarged too). Sound uploads are checked by
              their real format, so a renamed M4A is refused instead of playing silence. Flash it with
              installer button 5, or upload `CYD-PhotoFrame-freenove4-update.bin` on the `/update` page of a
              frame that is already running. Use a finger: the screen ignores a plastic stylus.
            - **The CYD firmware is unchanged from 4.2** apart from the version number. Installer
              buttons 1-5 all flash 4.3. Confirmed working on the 3.5-inch CYD (issue #3).

            ## What's new in 4.2

            - **Watchdog:** if the main loop ever hangs for 30 seconds, the frame restarts itself instead of freezing.
            - **Last restart reason** in the web page's *System* panel (power on, crash, watchdog, brownout...),
              so crashes can be spotted without a serial cable.
            - **New `cyd35` build** for the 3.5" CYD (ST7796, 480×320). Its touch controller shares the
              display's SPI pins, which froze the display in earlier versions (issue #3). Touch now goes
              through TFT_eSPI, with a one-time four-corner calibration on first start (and a
              *Recalibrate touch* button in the web page's System panel).
              Confirmed working on a real 3.5" board (issue #3). Flash it with installer button 4, or upload
              `CYD-PhotoFrame-cyd35-update.bin` on the `/update` page of a frame that is already on WiFi.
            - **New setting: Invert colours** (*Settings*), next to *Swap red and blue*.

            ## What's new in 4.1

            - **New setting: Swap red and blue** (*Settings*). Fixes the colour order on panels wired the other way round.
            - Display set-up hardened: the panel-ID read at boot can no longer affect the colour order.

            ## 4.0 (major rework)

            SD card access is thread-safe, uploads/deletes are reliable, new single-page web interface
            (drag-and-drop upload with in-browser resize, thumbnails, settings), touch controls, night mode,
            MP3 support, large photos scaled to fit, works without WiFi. See the README.
