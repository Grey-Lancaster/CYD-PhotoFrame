[platformio]
src_dir = .
default_envs = cyd

[env]
; Pinned: newer platform releases move to Arduino-ESP32 3.x, which this project
; (internal DAC audio, legacy APIs) does not build with.
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

lib_deps =
	wnatth3/WiFiManager@2.0.16-rc.2
	bodmer/TFT_eSPI@2.5.43
	bitbank2/JPEGDEC@1.8.4
	greiman/SdFat@2.3.1
	nitek/XPT2046_Bitbang_Slim@2.0.0
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@3.5.0
	ricmoo/QRCode@0.0.1
	earlephilhower/ESP8266Audio@1.9.9
	https://github.com/ayushsharma82/ElegantOTA.git#00674c4656def54f7f96a142c26c1f044a63043b

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
	-DUSER_SETUP_LOADED
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DUSE_HSPI_PORT
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT=0
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:cyd]
build_flags =
	${env.build_flags}
	-DTFT_BL=21
	-DSPI_FREQUENCY=55000000
	-DILI9341_2_DRIVER

[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DTFT_BL=21
	-DSPI_FREQUENCY=55000000
	-DST7789_DRIVER
	-DTFT_INVERSION_OFF

[env:cyd2b]
build_flags =
	${env.build_flags}
	-DTFT_BL=21
	-DSPI_FREQUENCY=55000000
	-DILI9341_2_DRIVER
	-DTFT_INVERSION_ON
	-DENV_CYD2B

; 3.5" CYD (ESP32-3248S035R / "ESP32-32E 320x480"): ST7796, backlight on GPIO27.
; Touch (XPT2046, CS 33) shares the display's SPI pins, so TFT_eSPI drives it.
; Confirmed working on the ESP32-32E 3.5" board by a user (issue #3); sound untested.
[env:cyd35]
build_flags =
	${env.build_flags}
	-DBOARD_CYD35
	-DST7796_DRIVER
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_BL=27
	-DSPI_FREQUENCY=40000000
	-DTOUCH_CS=33
